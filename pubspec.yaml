name: credflare_sdk
description: Native document collection and scoped applicant sessions for CredFlare.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  image_picker: ^1.2.4
  file_selector: ^1.1.0
  camera: ^0.12.0+2
  google_mlkit_face_detection: ^0.14.0
  geolocator: ^14.1.2
  image: ^4.13.1
  url_launcher: ^6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  assets:
    - assets/credflare-mark.png
  fonts:
    - family: Ubuntu
      fonts:
        - asset: assets/fonts/Ubuntu-Regular.ttf
        - asset: assets/fonts/Ubuntu-Medium.ttf
          weight: 500
        - asset: assets/fonts/Ubuntu-Bold.ttf
          weight: 700
